name: Android APK

# Construit l'APK (et l'AAB pour le Play Store) de l'espace membre.
# L'app est une Trusted Web Activity : elle affiche https://espace-membre.americanfullfightingbons.fr
# dans Chrome en plein écran. Elle se met donc à jour toute seule à chaque déploiement
# du Worker — il n'y a à reconstruire l'APK que si android/ change (icône, nom, version…).
#
# Lancer : onglet Actions → « Android APK » → Run workflow,
#          ou pousser un tag :  git tag android-v1.0.1 && git push origin android-v1.0.1

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (ex. 1.0.1)"
        default: "1.0.0"
  push:
    tags: ["android-v*"]

concurrency:
  group: android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Déterminer la version affichée
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          echo "ANDROID_VERSION_NAME=${VERSION:-1.0.0}" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Installer les composants du SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents : build DEBUG (installable pour test, mais sans vérification du domaine → barre d'adresse visible). Lancez scripts/make-keystore.sh."
          fi

      - name: Build release (signé)
        if: steps.signing.outputs.release == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Build debug (non signé pour la prod)
        if: steps.signing.outputs.release != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rassembler les fichiers
        run: |
          mkdir -p dist-android
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk "dist-android/affbc-espace-membre-${ANDROID_VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/*.aab "dist-android/affbc-espace-membre-${ANDROID_VERSION_NAME}.aab"
          else
            cp android/app/build/outputs/apk/debug/*.apk "dist-android/affbc-espace-membre-${ANDROID_VERSION_NAME}-debug.apk"
          fi
          ls -la dist-android

      - name: Vérifier la liaison domaine ↔ application (assetlinks)
        if: steps.signing.outputs.release == 'true'
        run: |
          FP="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^ *SHA256: *//p' | head -n1)"
          LIVE="$(curl -fsSL https://espace-membre.americanfullfightingbons.fr/.well-known/assetlinks.json || true)"
          {
            echo "### APK signé : affbc-espace-membre-${ANDROID_VERSION_NAME}.apk (versionCode ${ANDROID_VERSION_CODE})"
            echo ""
            echo "Empreinte SHA-256 de la clé : \`$FP\`"
            echo ""
            if echo "$LIVE" | grep -qF "$FP"; then
              echo "✅ \`assetlinks.json\` en ligne contient cette empreinte : l'app s'ouvrira en plein écran, sans barre d'adresse."
            else
              echo "⚠️ \`assetlinks.json\` en ligne ne contient PAS cette empreinte. Déployez le Worker avec le fichier généré par \`scripts/make-keystore.sh\` (l'app fonctionnera, mais avec une barre d'adresse Chrome)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les fichiers du build
        uses: actions/upload-artifact@v4
        with:
          name: affbc-espace-membre-android
          path: dist-android/*
          retention-days: 90
          if-no-files-found: error

      - name: Publier une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-v${{ env.ANDROID_VERSION_NAME }}"
          files: dist-android/*
          name: "Espace membre Android v${{ env.ANDROID_VERSION_NAME }}"
          prerelease: ${{ steps.signing.outputs.release != 'true' }}
          generate_release_notes: true
